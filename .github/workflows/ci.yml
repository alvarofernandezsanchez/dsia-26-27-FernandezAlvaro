
name: dsia-ci

on:
  push:
    branches:
      - main
      - feature/proyecto-i
      - feature/proyecto-ii
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install course dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (tema 2)
        working-directory: 2_pruebas_y_despliegue/ejemplos
        run: pytest -q

      - name: API template tests (tema 5)
        working-directory: 5_desarrollo_end_to_end/plantilla_proyecto
        run: pytest -q

  proyecto-i:
    name: Proyecto I - Tests y cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyectos/proyecto_i

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Project I tests with coverage
        run: |
          uv run pytest -q \
            --cov=divisas_app \
            --cov-report=term-missing \
            --cov-fail-under=60

  proyecto-ii:
    name: Proyecto II - Tests y calidad
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyectos/proyecto_ii

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Project II tests
        run: uv run pytest -q

      - name: Check code quality
        run: uv run ruff check .
