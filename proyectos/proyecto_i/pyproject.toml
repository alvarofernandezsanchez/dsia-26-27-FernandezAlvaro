[project]
name = "proyecto-i-calidad-datos"
version = "0.1.0"
description = "Pipeline de calidad de datos de ventas y divisas"
readme = "README.md"
authors = [
    { name = "Alvaro Fernandez Sanchez", email = "alvaroarquero1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[project.scripts]
divisas-app = "divisas_app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["divisas_app", "ventas_app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
